services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '2002'
      POSTGRES_DB: bd_otb
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: .
      target: development
    container_name: server_otb_dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules_otb_backend:/app/node_modules
      - ./uploads:/app/uploads
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=2002
      - DB_NAME=bd_otb
      - PORT=3000
      - NODE_ENV=development
      - JWT_SECRET=tu_secreto_aqui
      - JWT_EXPIRES_IN=720h
    depends_on:
      - postgres
volumes:
  postgres_data:
  node_modules_otb_backend:

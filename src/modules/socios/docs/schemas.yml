Socio:
  type: object

  properties:
    id:
      type: integer

    ci_socio:
      type: ingeger

    ci_expedido_socio:
      type: string

    nombres_socio:
      type: string

    primer_apellido_socio:
      type: string

    segundo_apellido_socio:
      type: string

    numero_celular_socio:
      type: string

    numero_telefono_socio:
      type: string

    genero_socio:
      type: string

    direccion_socio:
      type: string

    estado_socio:
      type: string

  example:
    id: 1
    ci_socio: '1234567'
    ci_expedido_socio: LP
    nombres_socio: Juan
    primer_apellido_socio: Perez
    segundo_apellido_socio: Gomez
    numero_celular_socio: '12345678'
    numero_telefono_socio: '12345678'
    genero_socio: MASCULINO
    direccion_socio: Calle 123
    estado_socio: activo

SociosPaginatedResponse:
  type: object
  properties:
    ok:
      type: boolean
      example: true

    message:
      type: string
      example: Socios obtenidos correctamente

    total:
      type: integer
      example: 25

    page:
      type: integer
      example: 1

    limit:
      type: integer
      example: 10

    totalPages:
      type: integer
      example: 3

    data:
      type: array
      items:
        $ref: '#/Socio'

SociosSelectResponse:
  type: object
  properties:
    ok:
      type: boolean
      example: true
    message:
      type: string
      example: Socios obtenidos correctamente
    data:
      type: array
      items:
        type: object
        properties:
          id:
            type: integer
            example: 1
          ci_socio:
            type: string
            example: '1234567'
          nombres_socio:
            type: string
            example: Jhoan
          primer_apellido_socio:
            type: string
            example: Perez
          segundo_apellido_socio:
            type: string
            example: Gomez

SociosDeletedsResponse:
  type: object
  properties:
    ok:
      type: boolean
      example: true

    message:
      type: string
      example: Socios eliminados obtenidos correctamente

    total:
      type: integer
      example: 25

    page:
      type: integer
      example: 1

    limit:
      type: integer
      example: 10

    totalPages:
      type: integer
      example: 3

    data:
      type: array
      items:
        $ref: '#/Socio'

SocioCreateRequest:
  type: object
  properties:
    ci_socio:
      type: string
      example: '1234567'
    ci_expedido_socio:
      type: string
      example: LP
    nombres_socio:
      type: string
      example: Juan
    primer_apellido_socio:
      type: string
      example: Perez
    segundo_apellido_socio:
      type: string
      example: Gomez
    numero_celular_socio:
      type: string
      example: '12345678'
    numero_telefono_socio:
      type: string
      example: '12345678'
    genero_socio:
      type: string
      example: MASCULINO
    direccion_socio:
      type: string
      example: Calle 123
    estado_socio:
      type: string
      example: HABILITADO

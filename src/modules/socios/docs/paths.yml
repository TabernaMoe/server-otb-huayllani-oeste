socio:
  get:
    tags:
      - Socios

    summary: Obtener socios paginados

    parameters:
      - in: query
        name: page
        schema:
          type: integer
          example: 1
        description: Página actual

      - in: query
        name: limit
        schema:
          type: integer
          example: 10
        description: Cantidad de registros por página

      - in: query
        name: search
        schema:
          type: string
          example: Juan
        description: Buscar por nombre o CI

    responses:
      200:
        description: Socios obtenidos correctamente
        content:
          application/json:
            schema:
              $ref: './schemas.yml#/SociosPaginatedResponse'
  post:
    tags:
      - Socios

    summary: Crear un nuevo socio

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yml#/SocioCreateRequest'

    responses:
      201:
        description: Socio creado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                ok:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Socio creado correctamente
                data:
                  $ref: './schemas.yml#/Socio'
  patch:
    tags:
      - Socios

    summary: Actualizar un socio existente

    parameters:
      - in: query
        name: id
        schema:
          type: integer
          example: 1
        description: ID del socio a actualizar

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yml#/SocioCreateRequest'

    responses:
      200:
        description: Socio actualizado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                ok:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Socio actualizado correctamente
                data:
                  $ref: './schemas.yml#/Socio'
  delete:
    tags:
      - Socios

    summary: Eliminar un socio

    parameters:
      - in: query
        name: id
        schema:
          type: integer
          example: 1
        description: ID del socio a eliminar

    responses:
      200:
        description: Socio eliminado correctamente
        content:
          application/json:
            schema:
              type: object
              properties:
                ok:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Socio eliminado correctamente
